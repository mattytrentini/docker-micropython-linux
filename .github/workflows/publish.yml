name: Build and publish MicroPython unix Docker image

on:
  schedule:
    - cron: '0 6 * * *'   # daily @ 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and push even if the tag already exists on Docker Hub'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-micropython-unix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest MicroPython release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/micropython/micropython/releases/latest --jq .tag_name)
          echo "Latest MicroPython release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if this version is already published
        id: check
        run: |
          if docker manifest inspect "micropython/unix:${{ steps.latest.outputs.tag }}" > /dev/null 2>&1; then
            echo "Tag ${{ steps.latest.outputs.tag }} already published, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ steps.latest.outputs.tag }} not found on Docker Hub, will build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MICROPY_VERSION=${{ steps.latest.outputs.tag }}
          tags: |
            micropython/unix:${{ steps.latest.outputs.tag }}
            micropython/unix:latest
